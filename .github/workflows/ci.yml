name: CI/CD Pipeline

# Only run when code is pushed to main or in a Pull Request targeting main
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # 1. Quality & Test Gate
  verify:
    name: Build, Unit & E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install All Dependencies
        run: |
          npm install
          npm install --prefix frontend
          npm install --prefix admin
          npm install --prefix server

      - name: Run Vitest Unit Tests
        run: npm run test:unit

      - name: Verify Frontend & Admin Production Builds
        run: npm run build

      - name: Install Playwright Chromium with OS Dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright End-to-End Tests
        env:
          CI: true
        run: npm run test:e2e

      - name: Upload Test Results / Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # 2. Production Deployment (ONLY runs when main branch is updated & all tests pass)
  deploy:
    name: Deploy to Production
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Production Deployment Trigger
        run: |
          echo "============================================="
          echo "✅ All tests and production builds passed!"
          echo "🚀 Deploying 'main' branch to production..."
          echo "============================================="
